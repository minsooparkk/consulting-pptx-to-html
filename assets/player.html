<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>{{STYLE}}</style>
</head>
<body>
<main id="ppt-player" aria-label="프레젠테이션 플레이어">
  <div id="stage" tabindex="0" aria-label="슬라이드 캔버스"><div id="deck" class="ppt-deck">{{SLIDES}}</div></div>
  <div id="player-warning" class="ppt-warning" role="alert" hidden></div>
  <nav class="ppt-controls" aria-label="프레젠테이션 컨트롤">
    <button id="prev" type="button" aria-label="이전 슬라이드">이전</button>
    <span><output id="current" aria-label="현재 슬라이드">1</output> / <span id="total">1</span></span>
    <button id="next" type="button" aria-label="다음 슬라이드">다음</button>
    <label for="jump">슬라이드 이동</label><input id="jump" type="number" min="1" step="1" aria-label="슬라이드 번호">
    <button id="edit" type="button" aria-pressed="false" aria-label="편집 모드">편집</button>
    <button id="notes-toggle" type="button" aria-label="발표자 노트" hidden>노트</button>
    <button id="fullscreen" type="button" aria-label="전체 화면">전체 화면</button>
  </nav>
  <aside id="notes" class="ppt-notes" aria-label="발표자 노트" hidden></aside>
</main>
<script id="ppt-manifest" type="application/json">{{MANIFEST}}</script>
<script>{{SCRIPT}}</script>
</body>
</html>
